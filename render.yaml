# Render Blueprint: Render reads this file and sets up the web service from it.
# Secrets are marked sync: false, so Render asks you for them and they are never stored in git.
services:
  - type: web
    name: fixtrail
    runtime: node
    plan: free
    region: singapore # closest to India; match your Atlas cluster region if you can
    # Build tools (TypeScript, Vite, Tailwind) are dev dependencies, so they must be installed
    # even though NODE_ENV is production. Without --include=dev the build fails.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Atlas connection string. You type this in Render's dashboard.
      - key: MONGODB_URI
        sync: false
      # Generated by Render: a random secret, never shown in git.
      - key: JWT_SECRET
        generateValue: true
      # Your Render URL, for example https://fixtrail.onrender.com. Set after the first deploy.
      - key: CLIENT_ORIGIN
        sync: false
      # Test build only: email-only login. Acknowledged explicitly so the server accepts it.
      - key: DEMO_LOGIN
        value: "true"
      - key: DEMO_LOGIN_ACKNOWLEDGED
        value: "true"
